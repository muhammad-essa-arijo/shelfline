# Render sets PORT. Locally the server uses 8080.
server.port=${PORT:8080}

# Comma-separated list of allowed frontend origins.
allowed.origin=${ALLOWED_ORIGIN:http://localhost:5500,http://127.0.0.1:5500}

# A medicine is "low stock" when its total units are below this number.
shelfline.low-stock-threshold=50
