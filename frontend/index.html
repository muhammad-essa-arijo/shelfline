<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShelfLine</title>
  <meta name="description" content="ShelfLine is a FIFO pharmacy stock manager. Oldest stock out first.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/queue.css">
  <script>
    // Apply the saved theme before the page paints, so it does not flash.
    try {
      if (localStorage.getItem("shelfline-theme") === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    } catch (e) { /* storage blocked: stay on the light theme */ }
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="brand" id="brand"></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <div class="main-col">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false"></button>
      <div class="search" id="search-wrap">
        <label class="sr-only" for="search">Search medicines by name</label>
      </div>
      <div class="topbar-date" id="topbar-date"></div>
      <button class="icon-btn" id="theme-btn" type="button" aria-pressed="false"></button>
    </header>

    <div class="banner" id="slow-banner" role="status" hidden></div>

    <main class="content" id="main" tabindex="-1"></main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
  <noscript>ShelfLine needs JavaScript. Turn it on in your browser settings and reload the page.</noscript>
</body>
</html>
